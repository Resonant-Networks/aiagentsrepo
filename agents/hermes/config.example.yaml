mcp_servers:
  zammad:
    command: docker
    args:
    - run
    - --rm
    - -i
    - -e
    - ZAMMAD_URL
    - -e
    - ZAMMAD_HTTP_TOKEN
    - ghcr.io/basher83/zammad-mcp:latest
    env:
      ZAMMAD_HTTP_TOKEN: YOUR_ZAMMAD_HTTP_TOKEN
      ZAMMAD_URL: http://YOUR_ZAMMAD_HOST/api/v1
    connect_timeout: 30.0
    enabled: true
  slack:
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-slack'
    env:
      SLACK_BOT_TOKEN: xoxb-YOUR_SLACK_BOT_TOKEN
      SLACK_TEAM_ID: YOUR_SLACK_TEAM_ID
    connect_timeout: 60.0
    enabled: true
  fnt:
    command: python3
    args:
    - /home/ubuntu/fnt-mcp/server.py
    env:
      FNT_HOST: YOUR_FNT_HOST
      FNT_USERNAME: command
      FNT_PASSWORD: YOUR_FNT_PASSWORD
      FNT_VERIFY_SSL: 'false'
    connect_timeout: 30.0
    enabled: true
  proxmox:
    command: /usr/bin/python3
    args:
    - /home/ubuntu/scripts/proxmox_mcp_stdio.py
    env:
      PROXMOX_URL: https://YOUR_PROXMOX_HOST:8006/api2/json
      PROXMOX_TOKEN_NAME: YOUR_PROXMOX_TOKEN_NAME
      PROXMOX_TOKEN_VALUE: YOUR_PROXMOX_TOKEN_VALUE
      PROXMOX_VERIFY_SSL: 'false'
    enabled: true
